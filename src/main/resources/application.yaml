spring:
  application:
    name: notification-service

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:seu_email@gmail.com}
    password: ${MAIL_PASSWORD:} # Insira sua senha de aplicativo do email aqui
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  thymeleaf:
    enable: true

email:
  send:
    sender-email: ${spring.mail.username}
    sender-name: 'Seu Nome' # Insira seu nome aqui

server:
  port: ${SERVER_PORT:8082}
